<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your RenuStore Pro account">
    <title>RenuStore Pro - Create Account</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">RenuStore</a>
            </div>

            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </nav>

            <div class="header-actions">
                <a href="cart.html" class="cart-icon" aria-label="Shopping Cart">
                    🛒
                    <span class="cart-count">0</span>
                </a>
                <button type="button" class="menu-toggle" aria-label="Open Menu">☰</button>
            </div>
        </div>
    </header>

    <!-- ================= SIGNUP ================= -->
    <main>
        <section class="auth-page">
            <div class="container">
                <div class="auth-box">
                    <h1>Create Account 🎉</h1>
                    <p class="auth-subtitle">Join RenuStore and start shopping</p>

                    <!-- Message Container -->
                    <div id="signupMessage" class="login-message" aria-live="polite" style="display: none;"></div>

                    <!-- SIGNUP FORM -->
                    <form id="signupForm" novalidate>
                        <!-- NAME -->
                        <div class="form-group">
                            <label for="signupName">Full Name</label>
                            <input
                                type="text"
                                id="signupName"
                                name="name"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                minlength="2"
                                required>
                        </div>

                        <!-- EMAIL -->
                        <div class="form-group">
                            <label for="signupEmail">Email Address</label>
                            <input
                                type="email"
                                id="signupEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required>
                        </div>

                        <!-- PASSWORD -->
                        <div class="form-group">
                            <label for="signupPassword">Password</label>
                            <input
                                type="password"
                                id="signupPassword"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="6"
                                required>
                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                minlength="6"
                                required>
                        </div>

                        <!-- TERMS -->
                        <div class="remember-box">
                            <label>
                                <input type="checkbox" id="termsCheckbox" required>
                                I agree to the <a href="terms.html">Terms &amp; Conditions</a>
                            </label>
                        </div>

                        <!-- SIGNUP BUTTON -->
                        <button type="submit" class="auth-btn" id="signupButton">
                            Create Account
                        </button>
                    </form>

                    <!-- LOGIN LINK -->
                    <p class="auth-link">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-box">
                    <h3>RenuStore</h3>
                    <p>Your trusted online grocery store.</p>
                </div>

                <div class="footer-box">
                    <h3>Quick Links</h3>
                    <a href="index.html">Home</a>
                    <a href="products.html">Products</a>
                    <a href="cart.html">Cart</a>
                </div>

                <div class="footer-box">
                    <h3>Support</h3>
                    <a href="contact.html">Contact</a>
                    <a href="privacy-policy.html">Privacy Policy</a>
                    <a href="terms.html">Terms &amp; Conditions</a>
                </div>
            </div>

            <p class="copyright">
                © 2026 RenuStore. All Rights Reserved.
            </p>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script type="module" src="auth.js"></script>
    <script src="app.js"></script>
    <script src="cart.js"></script>
    <script src="search.js"></script>
    <script src="ui.js"></script>
</body>

</html>
