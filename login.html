<!-- Login Section Start -->

<main>


<section class="auth-page">


<div class="container">


<div class="auth-box">


<h1>
Login
</h1>

<!-- Login Form Start -->


<div id="loginMessage" class="login-message" aria-live="polite"></div><form id="loginForm">


<div class="form-group">

<label>
Email Address
</label>


<input 
type="email"
id="loginEmail"
placeholder="Enter your email"
required>


</div>




<div class="form-group">

<label>
Password
</label>


<input 
type="password"
id="loginPassword"
placeholder="Enter your password"
required>


</div>




<div class="remember-box">


<label>

<input 
type="checkbox"
id="rememberMe">

Remember Me

</label>


</div>




<button 
type="submit"
class="auth-btn">

Login

</button>



<p class="auth-link">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</p>


</form>


<!-- Login Form End -->

<!-- Extra Auth Section Start -->


<div class="divider">

<span>
OR
</span>

</div>



<div class="social-login">


<button class="google-login">

🔵 Continue with Google

</button>



<button class="facebook-login">

🔷 Continue with Facebook

</button>


</div>



<div class="forgot-link">


<a href="forgot-password.html">

Forgot your password?

</a>


</div>



<!-- Extra Auth Section End -->


</div>
